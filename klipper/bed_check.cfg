####################################################################
#  bed-check - Klipper side
#
#  Copy this file into ~/printer_data/config/ and add this line to
#  printer.cfg:
#
#      [include bed_check.cfg]
#
#  The printer does NOT need python, opencv or gcode_shell_command.
#  The container pushes the state in here through Moonraker.
####################################################################

# Required for the console messages.
[respond]


####################################################################
#  State written by the watcher.
#
#  valid    : 0 = could not see the bed, 1 = valid measurement
#  occupied : 1 = there is an object on the bed
#  area     : mm2 of the largest blob that was found
#  ttl      : seconds of life left in the three values above
#
#  Do not edit these by hand - bed-check writes them.
####################################################################
[gcode_macro BED_STATE]
description: Current bed state as reported by bed-check
variable_valid: 0
variable_occupied: 0
variable_area: 0.0
variable_ttl: 0
gcode:
    {% set s = printer['gcode_macro BED_STATE'] %}
    {% if s.valid|int == 0 %}
        RESPOND PREFIX=bed-check: MSG="unknown state (the watcher cannot see the bed, or its state expired)"
    {% elif s.occupied|int == 1 %}
        RESPOND TYPE=error PREFIX=bed-check: MSG="OCCUPIED - object ~{s.area|float|round(0)} mm2"
    {% else %}
        RESPOND PREFIX=bed-check: MSG="clear"
    {% endif %}


####################################################################
#  Freshness watchdog.
#
#  Without this, a bed-check that crashes, loses the network or has its
#  container stopped leaves the values above frozen in place - and a
#  stale "clear" is indistinguishable from a fresh one, so the gate
#  would wave every future print through.
#
#  Klipper macros have no wall clock, so bed-check hands over a ttl in
#  seconds on every publish and this counts it down. If the refills stop
#  arriving, the state invalidates itself and the gate falls back to its
#  on_unknown behaviour.
#
#  WATCHDOG_S below must match DURATION at the end. bed-check refills ttl
#  with three heartbeats' worth (360s by default), so an ordinary quiet
#  period never trips it.
####################################################################
[delayed_gcode BED_CHECK_WATCHDOG]
initial_duration: 15
gcode:
    {% set s = printer['gcode_macro BED_STATE'] %}
    {% set WATCHDOG_S = 15 %}
    {% if s.ttl|float > 0 %}
        SET_GCODE_VARIABLE MACRO=BED_STATE VARIABLE=ttl VALUE={ [s.ttl|float - WATCHDOG_S, 0]|max }
    {% elif s.valid|int == 1 %}
        SET_GCODE_VARIABLE MACRO=BED_STATE VARIABLE=valid VALUE=0
        RESPOND TYPE=error PREFIX=bed-check: MSG="no update from the watcher - bed state expired"
    {% endif %}
    UPDATE_DELAYED_GCODE ID=BED_CHECK_WATCHDOG DURATION=15


####################################################################
#  The gate. Put it as the FIRST line of PRINT_START, before any
#  movement or heating.
#
#  action_raise_error stops the print instantly and cleanly, before
#  anything has had a chance to move.
####################################################################
[gcode_macro BED_CLEAR_GATE]
description: Stops the print if an object was left on the bed
# 'warn'  = warn and continue when it cannot see (fail-open)
# 'abort' = stop in that case as well (fail-closed)
variable_on_unknown: 'warn'
gcode:
    {% set s = printer['gcode_macro BED_STATE'] %}
    {% set mode = printer['gcode_macro BED_CLEAR_GATE'].on_unknown %}

    {% if s.valid|int == 1 and s.occupied|int == 1 %}
        { action_raise_error(
            "BED NOT CLEAR: object ~%d mm2 on the bed. Remove it and restart."
            % (s.area|float)) }

    {% elif s.valid|int == 0 %}
        {% if mode == 'abort' %}
            { action_raise_error(
                "bed-check: cannot verify that the bed is empty. Aborting.") }
        {% else %}
            RESPOND TYPE=error PREFIX=bed-check: MSG="could not verify the bed - continuing WITHOUT the check"
        {% endif %}

    {% else %}
        RESPOND PREFIX=bed-check: MSG="bed clear, starting"
    {% endif %}


####################################################################
#  Example usage
####################################################################
#
#  [gcode_macro PRINT_START]
#  gcode:
#      BED_CLEAR_GATE                 # <-- FIRST line, before any movement
#      {% set bed = params.BED|default(60)|float %}
#      {% set hotend = params.HOTEND|default(210)|float %}
#      M140 S{bed}
#      G28
#      ...
#
#  Manual check from the console:  BED_STATE
